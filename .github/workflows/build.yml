name: Build project with Maven
on:
  pull_request: 
  push:
    branches:
      - master
  schedule:
  - cron: '2 2 * * 1-5' # run nightly master builds on weekdays

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # TODO: add the SONAR_TOKEN repository secret and turn off Automatic Analysis in SonarCloud
      # (Administration > Analysis Method), otherwise the analysis step never runs
      # SONAR_TOKEN is not available on PRs from forks: the analysis step skips itself there
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # full history so SonarCloud can assign new code and blame
        fetch-depth: 0
    - name: Java setup
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - name: Cache
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Run Maven
      run: mvn -B clean verify -Djacoco.skip=false
    - name: Cache SonarCloud packages
      if: env.SONAR_TOKEN != ''
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      continue-on-error: true
#      run: mvn -B clean install com.mycila:license-maven-plugin:check
